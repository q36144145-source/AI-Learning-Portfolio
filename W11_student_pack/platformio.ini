; W11 - TinyML II and the memory hierarchy
; W03's six lines, plus TWO lines that decide whether today measures anything.

[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = log2file

; ---- the two lines that matter this week ---------------------------------------
; The board definition "esp32-s3-devkitc-1" in this platform version is the N8 variant:
; 8 MB quad flash and NO PSRAM. Our boards are N16R8: 16 MB flash and 8 MB OCTAL PSRAM.
; Without the next two lines the build links the quad-PSRAM libraries, the boot-time
; PSRAM init fails on the octal chip, the firmware continues as if nothing happened
; (CONFIG_SPIRAM_IGNORE_NOTFOUND), and every "PSRAM" allocation silently lands in
; internal SRAM. You would then measure SRAM twice and call one of them PSRAM.
;
; memory_type = qio_opi  -> flash quad, PSRAM OCTAL: selects the library set
;                           built with CONFIG_SPIRAM_MODE_OCT
; -DBOARD_HAS_PSRAM      -> the Arduino core's PSRAM init is compiled in
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM

; Deliberately NOT changed: the partition table stays default_8MB.csv, so the Flash
; denominator you see (3342336) is the same as in W03-W08. The chip has 16 MB; the
; firmware only uses the first 8 MB of it, and today's flash test maps a region inside
; those 8 MB. Nothing here needs the other half.
