; W10 - TinyML I: data, labelling and the training pipeline
; The same six lines as W03. Nothing here changes during the session.
; No lib_deps: the model is a header file, not a library. Nothing to install.

; The boards are ESP32-S3-DevKitC-1 (N16R8), not XIAO. The board line reflects that.
[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; The monitor writes everything it receives to a .log file in this folder while still
; showing it on screen. One run = one session = one log. Rename each one as you finish.
monitor_filters = log2file
