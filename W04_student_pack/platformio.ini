; W04 - ADC and the Analog Front End
; Identical to W03's file. The board line and the monitor filter are the two
; that matter, and neither has changed.

[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; The monitor writes everything it receives to a .log file in this folder,
; while still showing it on screen. You never select text with the mouse,
; and nothing can scroll off the top and be silently lost.
monitor_filters = log2file

; ---------------------------------------------------------------------------
; THE USB PORT QUESTION - same as W03.
; This board has TWO USB-C sockets. With the settings above, Serial is UART0,
; which is the socket wired through the USB-serial bridge chip. Use that one.
; If no serial port appears on either socket, uncomment the line below and
; rebuild: Serial then becomes the chip's own native USB, which needs no
; driver on any operating system.
; build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
; ---------------------------------------------------------------------------
